version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    ignore:
      # These releases require a coordinated Android toolchain upgrade.
      - dependency-name: "androidx.lifecycle:*"
        versions: ["[2.11.0,)"]
      - dependency-name: "androidx.navigation:navigation-compose"
        versions: ["[2.9.8,)"]
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: ["[2.4.0,)"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
